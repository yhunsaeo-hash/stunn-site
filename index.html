<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stunn | Your pocket camera collection</title>
  <meta name="description" content="Photo, video, and photobooth cameras for iPhone and iPad.">
  <meta name="theme-color" content="#070707">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://stunn.app/">
  <meta property="og:title" content="Stunn">
  <meta property="og:description" content="Your pocket camera collection.">
  <meta property="og:image" content="https://stunn.app/img/stunn-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Stunn">
  <meta name="twitter:description" content="Your pocket camera collection.">
  <meta name="twitter:image" content="https://stunn.app/img/stunn-icon.png">
  <link rel="icon" type="image/png" href="img/stunn-icon.png">
  <link rel="apple-touch-icon" href="img/stunn-icon.png">

  <style>
    :root {
      color-scheme: dark;
      --black: #070707;
      --ivory: #f5f1e8;
      --quiet: #b8b3aa;
      --line: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: url("img/hero-mobile.jpg") center 60% / cover no-repeat #090909;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.18) 43%, rgba(0, 0, 0, 0.03) 70%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.34) 0%, transparent 28%, transparent 68%, rgba(0, 0, 0, 0.46) 100%);
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      min-height: 112px;
      padding:
        max(30px, env(safe-area-inset-top))
        max(34px, env(safe-area-inset-right))
        24px
        max(34px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ivory);
      text-decoration: none;
    }

    .brand img {
      width: 48px;
      height: 48px;
      display: block;
      border-radius: 12px;
    }

    .wordmark {
      font-size: 35px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: -0.055em;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 13px;
      font-weight: 590;
    }

    .top-links a {
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.72);
    }

    .top-links a:hover { color: #fff; }

    .content {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: min(620px, calc(100% - 68px));
      padding: 34px;
      text-align: center;
      transform: translate(-50%, -48%);
    }

    .content::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -80px -120px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.46) 45%, transparent 74%);
      pointer-events: none;
    }

    h1 {
      max-width: 12ch;
      margin: 0 auto;
      font-size: clamp(48px, 5.2vw, 69px);
      line-height: 0.98;
      font-weight: 690;
      letter-spacing: -0.06em;
      text-wrap: balance;
      text-shadow: 0 3px 24px rgba(0, 0, 0, 0.78);
    }

    .intro {
      max-width: 32ch;
      margin: 20px auto 0;
      color: rgba(245, 241, 232, 0.78);
      font-size: 17px;
      line-height: 1.48;
      letter-spacing: -0.012em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
    }

    .download {
      width: fit-content;
      min-width: 198px;
      min-height: 62px;
      margin: 30px auto 0;
      padding: 9px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 12px;
      background: #050505;
      color: #fff;
      text-align: left;
      text-decoration: none;
      transition: transform 150ms ease, background-color 150ms ease;
    }

    .download:hover {
      transform: translateY(-2px);
      background: #171717;
    }

    .download:active { transform: translateY(0) scale(0.985); }

    .download svg {
      width: 29px;
      height: 29px;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .download-copy {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .download-small {
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .download-large {
      font-size: 20px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .legal {
      position: absolute;
      z-index: 1;
      left: max(34px, env(safe-area-inset-left));
      bottom: max(30px, env(safe-area-inset-bottom));
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 15px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }

    .legal a {
      color: inherit;
      text-decoration: none;
    }

    .legal a:hover { color: var(--ivory); }

    .download:focus-visible,
    .brand:focus-visible,
    .top-links a:focus-visible,
    .legal a:focus-visible {
      outline: 2px solid var(--ivory);
      outline-offset: 4px;
    }

    @media (max-width: 700px) {
      .hero {
        background-position: center 57%;
      }

      .hero::before {
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.38) 0%, rgba(0, 0, 0, 0.02) 30%, rgba(0, 0, 0, 0.04) 51%, rgba(0, 0, 0, 0.62) 100%);
      }

      .topbar {
        min-height: 92px;
        padding:
          max(22px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          18px
          max(20px, env(safe-area-inset-left));
      }

      .brand { gap: 10px; }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 10px;
      }

      .wordmark { font-size: 32px; }

      .top-links { gap: 16px; }
      .top-links .support-link { display: none; }

      .content {
        top: 52%;
        left: 50%;
        width: calc(100% - 34px);
        padding: 24px 18px;
        transform: translate(-50%, -50%);
      }

      h1 {
        max-width: 11ch;
        font-size: clamp(41px, 12vw, 51px);
      }

      .intro {
        max-width: 29ch;
        margin-top: 15px;
        font-size: 15px;
      }

      .download {
        min-height: 58px;
        margin-top: 22px;
      }

      .legal {
        left: max(20px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
      }

    }

    @media (max-height: 690px) and (max-width: 700px) {
      .content { top: 51%; padding: 18px 16px; }
      h1 { font-size: 39px; }
      .intro { margin-top: 12px; font-size: 14px; }
      .download { min-height: 54px; margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .download { transition: none; }
    }
  </style>
</head>

<body>
  <main class="hero">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Stunn home">

      <nav class="top-links" aria-label="Stunn links">

    </header>

    <section class="content" aria-label="Download Stunn">
      <h1>Your pocket camera collection.</h1>
      <p class="intro">Photo, video, and photobooth cameras for iPhone and iPad.</p>

      <a class="download" id="get" href="https://apps.apple.com/app/apple-store/id6793460911" aria-label="Download Stunn on the App Store">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z"/>
        </svg>
        <span class="download-copy">

        </span>
      </a>

      <p id="inapp-hint" hidden>
        In TikTok: tap <b>&bull;&bull;&bull;</b> then <b>Open in browser</b>.

    </section>

    <footer class="legal">

  </main>

  <!-- THE TIKTOK DEAD END, 2026-09-12. Measured in TikTok's own in-app
       browser on an iPhone: tapping Download raises TikTok's toast, "Action
       can't be completed", and nothing opens. The same link, the same phone,
       opens the App Store from Safari, so this is TikTok's WebView refusing
       the hand-off to another app, not a broken link and not the device.
       TikTok has blocked App Store destinations from personal creator
       accounts since 2023 and this is the message it shows.

       Nobody is left at a dead end now. The tap still runs the normal link,
       because that is what works in every other browser, and this follows a
       second later if the page is still here, which it only is when the
       hand-off failed. It names the one route that does work; opening in
       the real browser also keeps the campaign tag, since the tag travels
       in the address. -->
  <div id="inapp" hidden role="dialog" aria-live="polite" aria-label="Opening the App Store">
    <p class="inapp-title">TikTok can&rsquo;t open the App&nbsp;Store</p>
    <p class="inapp-line">
      Tap <b>&bull;&bull;&bull;</b> at the top right, then <b>Open in browser</b>.
    </p>
    <div class="inapp-row">
      <button type="button" id="inapp-copy">Copy link</button>
      <button type="button" id="inapp-close">Close</button>
    </div>
  </div>

  <style>
    /* Scoped to this panel so the page's own stylesheet is untouched. */
    #inapp[hidden], #inapp-hint[hidden] { display: none; }
    #inapp-hint {
      /* NO max-width, deliberately, and this is the second fix to the same
         line. It first had margin 14px 0 0, which pinned the box to the
         left edge; auto margins centred the box but the box was still
         capped at 30ch, and a ch is the width of a digit in whatever font
         and size the DEVICE settles on. On his phone the line came out
         wider than that cap and hung out of its own box to the left of
         centre, which is exactly what he saw. With no cap the box is the
         full column, the line centres inside it at any font size, and a
         line too long to fit wraps into two centred lines instead of
         hanging off the side. The shadow is .intro's, because this sits
         over the photograph just as that does. */
      margin: 14px auto 0;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--quiet);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
    }
    #inapp-hint b { color: var(--ivory); font-weight: 600; }
    #inapp {
      position: fixed;
      z-index: 50;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      max-width: 420px;
      margin: 0 auto;
      padding: 16px 16px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(14, 14, 14, 0.96);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    }
    .inapp-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ivory);
    }
    .inapp-line {
      margin: 0 0 14px;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--quiet);
    }
    .inapp-line b { color: var(--ivory); font-weight: 600; }
    .inapp-row { display: flex; gap: 10px; }
    #inapp button {
      flex: 1 1 auto;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ivory);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    #inapp #inapp-copy {
      background: var(--ivory);
      color: #101010;
      border-color: var(--ivory);
    }
  </style>

  <script>
    // CAMPAIGN TAGGING. stunn.app/?c=dumpling tags every App Store link on
    // this page for that account; anything else falls back to "web", so an
    // unknown or missing tag lands in its own bucket instead of being
    // credited to an account that did not earn it.
    //
    // It reads EVERY apps.apple.com link rather than one element id, because
    // the tracking and the page are edited by different hands: a redesign
    // that renames the button, or a second download link added later, would
    // otherwise drop attribution to "web" silently, with no error anywhere
    // and nothing in App Analytics to say it happened.
    //
    // The hand-off is a plain anchor on purpose. A script redirect or a meta
    // refresh counts as a navigation rather than a tap, and iOS will not open
    // the App Store from one inside an embedded browser, which is why links
    // pasted straight into social bios fail. The tap has to be the visitor's.
    (function () {
      var allowed = { dumpling: 1, stunn: 1, web: 1 };
      var campaign = new URLSearchParams(location.search).get("c");
      if (!campaign || !allowed[campaign]) campaign = "web";

      var store = document.querySelectorAll('a[href*="apps.apple.com"]');
      for (var i = 0; i < store.length; i++) {
        // searchParams.set rather than string concatenation: it overwrites a
        // tag already on the href instead of appending a second "?", which
        // would make the URL unopenable.
        var u = new URL(store[i].href, location.href);
        u.searchParams.set("pt", "129131821");
        u.searchParams.set("ct", campaign);
        u.searchParams.set("mt", "8");
        store[i].href = u.toString();
      }

      // Carry the tag across this site's own pages. Without this, a visitor
      // who taps the wordmark or reads Support and comes back arrives
      // untagged, and their install is credited to "web".
      if (campaign === "web") return;
      var here = document.querySelectorAll('a[href]');
      for (var j = 0; j < here.length; j++) {
        var v = new URL(here[j].href, location.href);
        if (v.origin !== location.origin) continue;
        if (!/(\/|\.html)$/.test(v.pathname)) continue;
        v.searchParams.set("c", campaign);
        here[j].href = v.toString();
      }
    })();

    // THE IN-APP BROWSER ROUTE, second cut. The first cut waited: it tried
    // the itms-apps scheme at 0.9s and only showed the panel at 2.1s. He
    // tested it inside TikTok and both halves were wrong. The scheme did not
    // open the App Store either, so that rung bought nothing and risked a
    // second error toast; and his verdict on the wait is the real finding:
    // "i think it takes too long to pop up the user would be gone or at
    // least i would be". A person who taps a button, sees an error and is
    // told nothing for two seconds has already left.
    //
    // The guidance now comes in two places. A line under the button before
    // the tap, which is the instant half and means the failed tap need not
    // happen at all, and the panel a second after the tap. The tap still
    // runs as an ordinary link first, because that is what opens the App
    // Store in every browser that is not this one; if it works, the page is
    // hidden, the panel is cancelled, and nobody ever reads either.
    (function () {
      var ua = navigator.userAgent || "";
      if (!/BytedanceWebview|musical_ly|Bytedance|TikTok|trill|Instagram|FBAN|FBAV|FB_IAB|Snapchat|Line\/|Twitter/i.test(ua)) {
        return;
      }

      var panel = document.getElementById("inapp");
      var hint = document.getElementById("inapp-hint");
      var store = document.querySelector('a[href*="apps.apple.com"]');
      if (!panel || !store) return;
      if (hint) hint.hidden = false;

      // HALF A SECOND, and the history is written down because the word
      // "currently" moved under us twice. 2.1s shipped first and he called
      // it too slow; 0ms replaced it and he called that too fast; 1.0s
      // followed, and he asked for half again. 500ms is the floor and the
      // reason is the fast edge he named: a panel that says TikTok cannot
      // open the App Store is a lie in any browser where the tap is about
      // to work, and under half a second it is drawn before the App Store
      // has had time to come up. It is still cancelled the moment the page
      // hides, so a working hand-off shows it briefly at worst.
      //
      // Nobody waits on this for guidance in any case. The line under the
      // button is already on screen before the tap.
      var timer = null;

      // A hidden page means the hand-off worked and this is not the broken
      // browser, so the panel is cancelled, and taken down if it is already
      // up rather than sitting there when they come back from the App Store.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) return;
        clearTimeout(timer);
        panel.hidden = true;
      });
      window.addEventListener("pagehide", function () { clearTimeout(timer); });

      store.addEventListener("click", function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (document.hidden) return;
          panel.hidden = false;
        }, 500);
      });

      document.getElementById("inapp-close").addEventListener("click", function () {
        panel.hidden = true;
      });

      document.getElementById("inapp-copy").addEventListener("click", function () {
        var button = this;
        var url = store.href;
        function done() {
          button.textContent = "Link copied";
          setTimeout(function () { button.textContent = "Copy link"; }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, fallback);
        } else {
          fallback();
        }
        function fallback() {
          var box = document.createElement("textarea");
          box.value = url;
          box.setAttribute("readonly", "");
          box.style.position = "fixed";
          box.style.opacity = "0";
          document.body.appendChild(box);
          box.select();
          box.setSelectionRange(0, url.length);
          try { document.execCommand("copy"); done(); } catch (e) { /* nothing to do */ }
          document.body.removeChild(box);
        }
      });
    })();
  </script>
</body>
</html>
