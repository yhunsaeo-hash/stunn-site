<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stunn | Your pocket camera collection</title>
  <meta name="description" content="Photo, video, and photobooth cameras for iPhone and iPad.">
  <meta name="theme-color" content="#070707">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://stunn.app/">
  <meta property="og:title" content="Stunn">
  <meta property="og:description" content="Your pocket camera collection.">
  <meta property="og:image" content="https://stunn.app/img/stunn-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Stunn">
  <meta name="twitter:description" content="Your pocket camera collection.">
  <meta name="twitter:image" content="https://stunn.app/img/stunn-icon.png">
  <link rel="icon" type="image/png" href="img/stunn-icon.png">
  <link rel="apple-touch-icon" href="img/stunn-icon.png">

  <style>
    :root {
      color-scheme: dark;
      --black: #070707;
      --ivory: #f5f1e8;
      --quiet: #b8b3aa;
      --line: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: url("img/hero-mobile.jpg") center 60% / cover no-repeat #090909;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.18) 43%, rgba(0, 0, 0, 0.03) 70%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.34) 0%, transparent 28%, transparent 68%, rgba(0, 0, 0, 0.46) 100%);
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      min-height: 112px;
      padding:
        max(30px, env(safe-area-inset-top))
        max(34px, env(safe-area-inset-right))
        24px
        max(34px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ivory);
      text-decoration: none;
    }

    .brand img {
      width: 48px;
      height: 48px;
      display: block;
      border-radius: 12px;
    }

    .wordmark {
      font-size: 35px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: -0.055em;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 13px;
      font-weight: 590;
    }

    .top-links a {
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.72);
    }

    .top-links a:hover { color: #fff; }

    .content {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: min(620px, calc(100% - 68px));
      padding: 34px;
      text-align: center;
      transform: translate(-50%, -48%);
    }

    .content::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -80px -120px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.46) 45%, transparent 74%);
      pointer-events: none;
    }

    h1 {
      max-width: 12ch;
      margin: 0 auto;
      font-size: clamp(48px, 5.2vw, 69px);
      line-height: 0.98;
      font-weight: 690;
      letter-spacing: -0.06em;
      text-wrap: balance;
      text-shadow: 0 3px 24px rgba(0, 0, 0, 0.78);
    }

    .intro {
      max-width: 32ch;
      margin: 20px auto 0;
      color: rgba(245, 241, 232, 0.78);
      font-size: 17px;
      line-height: 1.48;
      letter-spacing: -0.012em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
    }

    .download {
      width: fit-content;
      min-width: 198px;
      min-height: 62px;
      margin: 30px auto 0;
      padding: 9px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 12px;
      background: #050505;
      color: #fff;
      text-align: left;
      text-decoration: none;
      transition: transform 150ms ease, background-color 150ms ease;
    }

    .download:hover {
      transform: translateY(-2px);
      background: #171717;
    }

    .download:active { transform: translateY(0) scale(0.985); }

    .download svg {
      width: 29px;
      height: 29px;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .download-copy {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .download-small {
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .download-large {
      font-size: 20px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .legal {
      position: absolute;
      z-index: 1;
      left: max(34px, env(safe-area-inset-left));
      bottom: max(30px, env(safe-area-inset-bottom));
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 15px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }

    .legal a {
      color: inherit;
      text-decoration: none;
    }

    .legal a:hover { color: var(--ivory); }

    .download:focus-visible,
    .brand:focus-visible,
    .top-links a:focus-visible,
    .legal a:focus-visible {
      outline: 2px solid var(--ivory);
      outline-offset: 4px;
    }

    @media (max-width: 700px) {
      .hero {
        background-position: center 57%;
      }

      .hero::before {
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.38) 0%, rgba(0, 0, 0, 0.02) 30%, rgba(0, 0, 0, 0.04) 51%, rgba(0, 0, 0, 0.62) 100%);
      }

      .topbar {
        min-height: 92px;
        padding:
          max(22px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          18px
          max(20px, env(safe-area-inset-left));
      }

      .brand { gap: 10px; }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 10px;
      }

      .wordmark { font-size: 32px; }

      .top-links { gap: 16px; }
      .top-links .support-link { display: none; }

      .content {
        top: 52%;
        left: 50%;
        width: calc(100% - 34px);
        padding: 24px 18px;
        transform: translate(-50%, -50%);
      }

      h1 {
        max-width: 11ch;
        font-size: clamp(41px, 12vw, 51px);
      }

      .intro {
        max-width: 29ch;
        margin-top: 15px;
        font-size: 15px;
      }

      .download {
        min-height: 58px;
        margin-top: 22px;
      }

      .legal {
        left: max(20px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
      }

    }

    @media (max-height: 690px) and (max-width: 700px) {
      .content { top: 51%; padding: 18px 16px; }
      h1 { font-size: 39px; }
      .intro { margin-top: 12px; font-size: 14px; }
      .download { min-height: 54px; margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .download { transition: none; }
    }
  </style>
</head>

<body>
  <main class="hero">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Stunn home">
        <img src="img/stunn-icon.png" alt="">
        <span class="wordmark">Stunn</span>
      </a>

      <nav class="top-links" aria-label="Stunn links">
        <a href="support.html" class="support-link">Support</a>
        <a href="https://www.instagram.com/stunnapp/" rel="me">@stunnapp &#8599;</a>
      </nav>
    </header>

    <section class="content" aria-label="Download Stunn">
      <h1>Your pocket camera collection.</h1>
      <p class="intro">Photo, video, and photobooth cameras for iPhone and iPad.</p>

      <a class="download" id="get" href="https://apps.apple.com/app/apple-store/id6793460911" aria-label="Download Stunn on the App Store">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z"/>
        </svg>
        <span class="download-copy">
          <span class="download-small">Download on the</span>
          <span class="download-large">App Store</span>
        </span>
      </a>

    </section>

    <footer class="legal">
      <span>&copy; 2026 Stunn</span>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </footer>

  </main>

  <script>
    // CAMPAIGN TAGGING. stunn.app/?c=dumpling tags every App Store link on
    // this page for that account; anything else falls back to "web", so an
    // unknown or missing tag lands in its own bucket instead of being
    // credited to an account that did not earn it.
    //
    // It reads EVERY apps.apple.com link rather than one element id, because
    // the tracking and the page are edited by different hands: a redesign
    // that renames the button, or a second download link added later, would
    // otherwise drop attribution to "web" silently, with no error anywhere
    // and nothing in App Analytics to say it happened.
    //
    // The hand-off is a plain anchor on purpose. A script redirect or a meta
    // refresh counts as a navigation rather than a tap, and iOS will not open
    // the App Store from one inside an embedded browser, which is why links
    // pasted straight into social bios fail. The tap has to be the visitor's.
    (function () {
      var allowed = { dumpling: 1, stunn: 1, web: 1 };
      var campaign = new URLSearchParams(location.search).get("c");
      if (!campaign || !allowed[campaign]) campaign = "web";

      var store = document.querySelectorAll('a[href*="apps.apple.com"]');
      for (var i = 0; i < store.length; i++) {
        // searchParams.set rather than string concatenation: it overwrites a
        // tag already on the href instead of appending a second "?", which
        // would make the URL unopenable.
        var u = new URL(store[i].href, location.href);
        u.searchParams.set("pt", "129131821");
        u.searchParams.set("ct", campaign);
        u.searchParams.set("mt", "8");
        store[i].href = u.toString();
      }

      // Carry the tag across this site's own pages. Without this, a visitor
      // who taps the wordmark or reads Support and comes back arrives
      // untagged, and their install is credited to "web".
      if (campaign === "web") return;
      var here = document.querySelectorAll('a[href]');
      for (var j = 0; j < here.length; j++) {
        var v = new URL(here[j].href, location.href);
        if (v.origin !== location.origin) continue;
        if (!/(\/|\.html)$/.test(v.pathname)) continue;
        v.searchParams.set("c", campaign);
        here[j].href = v.toString();
      }
    })();
  </script>
</body>
</html>
